[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "parladata"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = [
    "Django==6.1.3",
    "langchain==1.5.2",
    "langchain-google-genai==4.5.2",
    "psycopg==3.3.9",
    "boto3==1.44.9",
    "django-storages==1.14.6",
    "gunicorn==27.0.1",
    "requests==2.34.2",
    "Pillow==13.0.0",
    "django-autoslug==1.9.9",
    "djangorestframework==3.18.3",
    "django-filter==26.2",
    "pymupdf==2.1",
    "django-taggit==7.0.0",
    "django-oauth-toolkit==3.4.1",
    "django-extensions==4.1",
    "ipython==9.19.1",
    "django-cors-headers==4.9.0",
    "django-tinymce==5.0.0",
    "pytest==9.2.0",
    "pytest-django==4.14.0",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "drf-spectacular==0.30.0",
    "python-memcached==1.62",
    "django-debug-toolbar==8.0.0",
    "pylibmc==1.8.0",
    "martor==1.9.2",
    "django-colorfield==0.14.0",
    "django-admin-sortable2==2.4",
    "sentry-sdk==2.76.0",
    "eventregistry==11.0",
    "django-import-export==4.4.6",
    "djangorestframework-csv==3.0.2",
    "drf-recaptcha==4.0.3",
    "xmltodict==1.0.4",
    "scikit-learn==1.9.1",
    "python-crfsuite==0.9.12",
    "marisa-trie==1.4.1",
    "pyicu==2.17",
    "uk-stemmer",
]

[dependency-groups]
dev = [
    "black==26.10.1",
    "django-stubs==6.1.2",
    "django-stubs-ext==6.1.2",
    "ipython==9.19.1",
    "isort",
]

[tool.uv.sources]
uk-stemmer = { git = "https://github.com/Desklop/Uk_Stemmer" }

[tool.setuptools.packages.find]
include = ["parladata_project*", "parladata*"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
