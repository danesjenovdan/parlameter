apiVersion: apps/v1
kind: Deployment
metadata:
  name: parlasite
  labels:
    app: parlasite
spec:
  replicas: 1
  selector:
    matchLabels:
      app: parlasite
  template:
    metadata:
      labels:
        app: parlasite
    spec:
      containers:
        - name: parlasite
          image: parlasite-hrvaska
          ports:
            - containerPort: 3066
          resources:
            requests:
              memory: 400Mi
              cpu: 100m
            limits:
              memory: 400Mi
              cpu: 100m
          env:
            - name: PARLASITE_CDN_URL
              value: "https://files.parlametar.hr"
            - name: PARLASITE_CARDS_URL
              value: "https://kartica.parlametar.hr"
            - name: PARLASITE_DATA_URL
              value: "https://data.parlametar.hr/v3"
            - name: PARLASITE_LEADER_ID
              value: "0"
            - name: PARLASITE_ROOT_ORG_ID
              value: "939"
            - name: PARLASITE_MANDATE_ID
              value: "1"
            - name: PARLASITE_DEFAULT_CARD_DATE
              value: "2024-03-24"
            - name: PARLASITE_NEWSLETTER_SEGMENT_ID
              value: "2"
            - name: SENTRY_DSN
              value: https://f7d45d6c90ea4cacb514a111c8c3e310@bugsink.danesjenovdan.si/5
            - name: SENTRY_ENVIRONMENT
              value: hrvaska
