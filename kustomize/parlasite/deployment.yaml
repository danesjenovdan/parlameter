apiVersion: apps/v1
kind: Deployment
metadata:
  name: parlasite
  labels:
    app: parlasite
spec:
  replicas: 1
  selector:
    matchLabels:
      app: parlasite
  template:
    metadata:
      labels:
        app: parlasite
    spec:
      containers:
        - name: parlasite
          image: parlasite-bosna
          ports:
            - containerPort: 3066
          resources:
            requests:
              memory: 400Mi
              cpu: 100m
            limits:
              memory: 400Mi
              cpu: 100m
          env:
            - name: PARLASITE_CDN_URL
              value: "https://files.ba.parlameter.si"
            - name: PARLASITE_CARDS_URL
              value: "https://kartica.ba.parlameter.si"
            - name: PARLASITE_DATA_URL
              value: "https://data.ba.parlameter.si/v3"
            - name: PARLASITE_LEADER_ID
              value: "0"
            - name: PARLASITE_ROOT_ORG_ID
              value: "6"
            - name: PARLASITE_ROOT_ORG_ID2
              value: "23"
            - name: PARLASITE_MANDATE_ID
              value: "1"
            - name: PARLASITE_DEFAULT_CARD_DATE
              value: "2022-11-29"
            - name: PARLASITE_NEWSLETTER_SEGMENT_ID
              value: "3"
            - name: SENTRY_DSN
              value: https://f7d45d6c90ea4cacb514a111c8c3e310@bugsink.danesjenovdan.si/5
            - name: SENTRY_ENVIRONMENT
              value: bosna
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"] # give load balancer time to stop sending traffic to this pod
          startupProbe:
            httpGet:
              path: /readyz
              port: 3066
            periodSeconds: 10
            failureThreshold: 30 # 30x10 = 300s = 5min
