apiVersion: apps/v1
kind: Deployment
metadata:
  name: parlasite
  labels:
    app: parlasite
spec:
  replicas: 1
  selector:
    matchLabels:
      app: parlasite
  template:
    metadata:
      labels:
        app: parlasite
    spec:
      containers:
        - name: parlasite
          image: parlasite-ajdovscina
          ports:
            - containerPort: 3066
          resources:
            requests:
              memory: 400Mi
              cpu: 100m
            limits:
              memory: 400Mi
              cpu: 100m
          env:
            - name: PARLASITE_CDN_URL
              value: "https://files.ajdovscina.parlameter.si"
            - name: PARLASITE_CARDS_URL
              value: "https://kartica.ajdovscina.parlameter.si"
            - name: PARLASITE_DATA_URL
              value: "https://data.ajdovscina.parlameter.si/v3"
            - name: PARLASITE_LEADER_ID
              value: "1"
            - name: PARLASITE_ROOT_ORG_ID
              value: "2"
            - name: PARLASITE_MANDATE_ID
              value: "1"
            - name: PARLASITE_DEFAULT_CARD_DATE
              value: "2022-12-07"
            - name: PARLASITE_NEWSLETTER_SEGMENT_ID
              value: ""
            - name: SENTRY_DSN
              value: https://f7d45d6c90ea4cacb514a111c8c3e310@bugsink.danesjenovdan.si/5
            - name: SENTRY_ENVIRONMENT
              value: ajdovscina
