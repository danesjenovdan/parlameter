apiVersion: apps/v1
kind: Deployment
metadata:
  name: parlacards
  labels:
    app: parlacards
spec:
  replicas: 1
  selector:
    matchLabels:
      app: parlacards
  template:
    metadata:
      labels:
        app: parlacards
    spec:
      containers:
        - name: parlacards
          image: parlacards-TODO-BRANCH-NAME-HERE
          ports:
            - containerPort: 3000
          resources:
            requests:
              memory: 1000Mi
              cpu: 200m
            limits:
              memory: 1000Mi
              cpu: 200m
          env:
            - name: VITE_PARLASSETS_URL
              value: https://parlassets-TODO-BRANCH-NAME-HERE.lb.djnd.si
            - name: VITE_PARLADATA_URL
              value: https://parladata-TODO-BRANCH-NAME-HERE.lb.djnd.si/v3
            - name: VITE_PARLACARDS_URL
              value: https://parlacards-TODO-BRANCH-NAME-HERE.lb.djnd.si
            - name: VITE_PARLASITE_URL
              value: https://parlasite-TODO-BRANCH-NAME-HERE.lb.djnd.si
            - name: VITE_METAIMAGES_URL
              value: https://meta-image-generator.djnd.si/parlameter
            - name: SENTRY_DSN
              value: https://14e0c5a0b2d24367b75f1640b2360814@bugsink.danesjenovdan.si/4
            - name: SENTRY_ENVIRONMENT
              value: TODO-BRANCH-NAME-HERE
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"] # give load balancer time to stop sending traffic to this pod
          startupProbe:
            httpGet:
              path: /readyz
              port: 3000
            periodSeconds: 10
            failureThreshold: 30 # 30x10 = 300s = 5min
