apiVersion: apps/v1
kind: Deployment
metadata:
  name: parlacards
  labels:
    app: parlacards
spec:
  replicas: 1
  selector:
    matchLabels:
      app: parlacards
  template:
    metadata:
      labels:
        app: parlacards
    spec:
      containers:
        - name: parlacards
          image: parlacards-hrastnik
          ports:
            - containerPort: 3000
          resources:
            requests:
              memory: 1000Mi
              cpu: 200m
            limits:
              memory: 1000Mi
              cpu: 200m
          env:
            - name: VITE_PARLASSETS_URL
              value: https://files.hrastnik.parlameter.si
            - name: VITE_PARLADATA_URL
              value: https://data.hrastnik.parlameter.si/v3
            - name: VITE_PARLACARDS_URL
              value: https://kartica.hrastnik.parlameter.si
            - name: VITE_PARLASITE_URL
              value: https://hrastnik.parlameter.si
            - name: VITE_PARLASITE_URL_BEFORE_2022_12_07
              value: https://2018.hrastnik.parlameter.si
            - name: VITE_METAIMAGES_URL
              value: https://meta-image-generator.djnd.si/parlameter
            - name: SENTRY_DSN
              value: https://14e0c5a0b2d24367b75f1640b2360814@bugsink.danesjenovdan.si/4
            - name: SENTRY_ENVIRONMENT
              value: hrastnik
