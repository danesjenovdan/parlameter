card:
  title: Nastopi, v katerih je bil iskalni niz izrečen
  info: >-
    # Seznam vseh govorov, v katerih je bil izrečen iskalni niz.


    Po transkriptih vseh sej poiščemo govore, v katerih se pojavi lema iskalnega
    niza, torej osnovna oblika vpisane besede ali besedne zveze.


    Govore razvrstimo po sejah, te pa od najnovejše proti najstarejši. Pri
    vsakem govoru izpišemo poslanko ali poslanca in odlomek, v katerem se pojavi
    iskalni niz.


    Transkripte pridobivamo s spletnega mesta [DZ RS](https://www.dz-rs.si/).
