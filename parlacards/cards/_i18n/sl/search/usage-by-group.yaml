card:
  title: Raba po poslanskih skupinah
  info: >-
    # Pregled pogostosti pojavljanja iskalnega niza v govorih glede na poslansko
    skupino.


    Preverimo, v koliko govorih članic in članov posamezne poslanske skupine se
    pojavi lema iskalnega niza, nato deleže prikažemo v krožnem grafikonu.
