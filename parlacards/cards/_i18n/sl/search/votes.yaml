card:
  title: Glasovanja, ki vsebujejo iskalni niz
  info: >-
    # Pregled glasovanj, ki vsebujejo iskalni niz.


    Poiščemo glasovanja, v naslovu katerih se pojavi lema iskalnega niza, torej
    osnovna oblika vpisane besede. Glasovanja razvrstimo po sejah in pri vsakem
    izpišemo uradni izid ter število glasov ZA, PROTI, VZDRŽANI in ODSOTNI.


    Nabor glasovanj pridobivamo s spletnega mesta [DZ RS](https://www.dz-rs.si/).
