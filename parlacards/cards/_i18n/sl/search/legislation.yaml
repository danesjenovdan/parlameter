card:
  title: Zakoni, ki vsebujejo iskalni niz
  info: >-
    # Seznam zakonov in aktov, ki ustrezajo iskalnemu nizu.


    V analizo vključimo vse zakone in akte, o katerih se je glasovalo v tem
    sklicu. Iskalni niz primerjamo z naslovom akta in z njegovim predlagateljem,
    zato med zadetki najdeš tudi akte, ki jih je vložila iskana oseba ali
    poslanska skupina.


    Pri vsakem zadetku izpišemo naslov, številko EPA (evidenca parlamentarnega
    akta) in status.


    Podatke pridobivamo s spletnega mesta [DZ RS](https://www.dz-rs.si/).
