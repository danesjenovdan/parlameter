card:
  title: Raba skozi čas
  info: >-
    # Pogostost pojavljanja iskalnega niza v govorih poslank in poslancev skozi
    čas.


    Preštejemo vse pojavitve leme iskalnega niza v transkriptih sej in jih
    seštejemo po mesecih. Rezultat prikažemo na črtnem grafu.


    S klikom na želeni zavihek izbereš prikaz za celoten mandat ali za zadnje
    leto.
