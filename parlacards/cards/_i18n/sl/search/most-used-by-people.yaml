card:
  title: Največkrat so iskalni niz uporabili
  info: >-
    # Seznam petih poslank in poslancev, ki so iskalni niz uporabili največkrat.


    Preštejemo, kolikokrat je posamezna oseba izrekla iskalni niz, in na seznam
    uvrstimo pet oseb, ki so ga izrekle največkrat.


    Pri vsaki izpišemo tudi poslansko skupino in število pojavitev iskalnega
    niza.
