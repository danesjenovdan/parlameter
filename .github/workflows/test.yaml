name: Test parladata
on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
jobs:
  test:
    name: Test parladata
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./parladata
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: parladata
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Install dependencies
        env:
          UV_PYTHON_DOWNLOADS: "0"
        run: |
          sudo apt-get update
          sudo apt-get install -y libmemcached-dev libsasl2-modules
          uv sync --locked --no-dev
          uv pip install classla==2.2.3

      - name: Test with pytest
        env:
          DJANGO_SETTINGS_MODULE: parladata_project.settings.k8s
          DATABASE_HOST: postgres
        run: |
          uv run pytest -n 4
